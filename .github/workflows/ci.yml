# The make targets, on each platform a release is built for. Nothing is
# defined here that the Makefile does not: only how sbcl gets onto the runner.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: sbcl (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: sbcl (macos)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - run: make FOREIGN=1 deps
      - run: make FOREIGN=1 test
      - run: make FOREIGN=1 test-term
      - run: make FOREIGN=1 atty && ./atty version
