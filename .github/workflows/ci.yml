# The make targets, on each platform a release is built for, with the sbcl a
# release is built with: `make sbcl' fetches it and it goes first on PATH.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make FOREIGN=1 sbcl && make -s sbcl-bin >> "$GITHUB_PATH"
      - run: make FOREIGN=1 deps
      - run: make FOREIGN=1 test
      - run: make FOREIGN=1 test-term
      - run: make FOREIGN=1 atty && ./atty version
