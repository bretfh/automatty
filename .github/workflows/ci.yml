# The make targets, on each platform a release is built for. Nothing is
# defined here that the Makefile does not: only how sbcl gets onto the runner.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # sbcl.org's own binary, not the distribution's: ubuntu 22.04 ships
      # 2.1.11, from 2021. 2.5.5 is the newest sbcl.org build that runs on the
      # glibc this runner is chosen for; from 2.5.9 on they want 2.38
      - name: sbcl (linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o sbcl.tar.bz2 https://downloads.sourceforge.net/project/sbcl/sbcl/2.5.5/sbcl-2.5.5-x86-64-linux-binary.tar.bz2
          tar xjf sbcl.tar.bz2
          cd sbcl-2.5.5-x86-64-linux && sudo sh install.sh
          sbcl --version

      - name: sbcl (macos)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - run: make FOREIGN=1 deps
      - run: make FOREIGN=1 test
      - run: make FOREIGN=1 test-term
      - run: make FOREIGN=1 atty && ./atty version
