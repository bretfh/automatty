name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      - run: make FOREIGN=1 atty

      - name: package as an AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp atty AppDir/usr/bin/atty
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cat > AppDir/usr/share/applications/atty.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=atty
          Exec=atty
          Icon=atty
          Categories=System;TerminalEmulator;
          Terminal=true
          DESKTOP
          convert -size 256x256 xc:none AppDir/usr/share/icons/hicolor/256x256/apps/atty.png 2>/dev/null \
            || touch AppDir/usr/share/icons/hicolor/256x256/apps/atty.png
          ln -s usr/bin/atty AppDir/AppRun
          ln -s usr/share/applications/atty.desktop AppDir/atty.desktop
          ln -s usr/share/icons/hicolor/256x256/apps/atty.png AppDir/atty.png
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir atty-x86_64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          files: atty-x86_64.AppImage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install sbcl
      - run: make FOREIGN=1 atty
      - run: tar czf atty-macos.tar.gz atty
      - uses: softprops/action-gh-release@v2
        with:
          files: atty-macos.tar.gz
