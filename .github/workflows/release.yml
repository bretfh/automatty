# A tag v* makes a release: `make release' on each platform, with the pinned
# sbcl `make sbcl' fetches, the tarballs and one SHA256SUMS on the release. The
# tag is the version the binary says, and the asset names are what `atty
# update' asks for.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs the tags
      - run: make FOREIGN=1 sbcl && make -s sbcl-bin >> "$GITHUB_PATH"
      - run: make FOREIGN=1 deps release
      - run: ./atty version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/

  # the linux tarballs run on a system far older than the runner that built
  # them: centos 7 is glibc 2.17, the oldest the pinned sbcl asks for
  run-elsewhere:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist && tar xzf atty-*-linux-${{ matrix.arch }}.tar.gz
          docker run --rm -v "$PWD:/x" centos:7 /x/atty version

  publish:
    needs: [build, run-elsewhere]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: one SHA256SUMS for every platform
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum atty-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/atty-*.tar.gz
            dist/SHA256SUMS
