# A tag v* makes a release: `make release' on each platform, the tarballs and
# one SHA256SUMS on the release. The tag is the version the binary says, and
# the asset names are what `atty update' asks for.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # the oldest linux the runners offer, so the binary runs on anything
        # newer; the arm and the intel mac
        os: [ubuntu-22.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs the tags

      - name: sbcl (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: sbcl (macos)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - run: make FOREIGN=1 deps release
      - run: ./atty version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: one SHA256SUMS for every platform
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum atty-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/atty-*.tar.gz
            dist/SHA256SUMS
